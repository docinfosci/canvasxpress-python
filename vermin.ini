; Vermin -- enforces the minimum supported Python version (3.8).
;
; Ruff's target-version = "py38" catches syntax that 3.8 cannot parse; vermin
; also catches 3.9+ standard library APIs and runtime-evaluated generics
; (e.g. list[int]) that parse fine but fail when run on 3.8.
;
; Usage:  uvx vermin canvasxpress
;
; Version-guarded code (sys.version_info checks, try/except ImportError
; fallbacks) is not understood by vermin; mark such lines with "# novermin".
[vermin]
targets = 3.8-
only_show_violations = yes
eval_annotations = yes
show_tips = no
; canvasxpress/version.py holds a bare version string, not Python code.
exclusion_regex = version\.py$
