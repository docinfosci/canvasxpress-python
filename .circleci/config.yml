workflows:
  github-commit:
    jobs:
      - build-python-oldest
      - build-python-latest
      - build-python-general:
          requires:
            - build-python-oldest
            - build-python-latest

  weekly:
    jobs:
      - build-python-oldest
      - build-python-latest
      - build-python-general:
          requires:
            - build-python-oldest
            - build-python-latest

    triggers:
      - schedule:
          cron: "0 0 * * 0"
          filters:
            branches:
              only:
                - main