# Python images provided by https://hub.docker.com/_/python

version: 2.1

jobs:
  build-python-general:
    docker:
      - image: python:3.10.12-bullseye

    steps:
      - checkout
      - run:
          name: Review checkout
          command: ls -la

      - run:
          name: Indicate build profile
          command: |
            echo "User: $(whoami) | User ID: ${UID} | Group ID: ${GID}"

            GIT_WORKING_BRANCH="$(git branch | grep \* | cut -d ' ' -f2)"
            if [ $GIT_WORKING_BRANCH = "main" ]
            then
                BRANCH_STAGE=${BRANCH_STAGE:="master"}
            else
                BRANCH_STAGE=${BRANCH_STAGE:="develop"}
            fi
            echo "Source edition matches '${BRANCH_STAGE}' (branch '${GIT_WORKING_BRANCH}')"

      - run:
          name: Install Linux Packages
          command: |
            export DEBIAN_FRONTEND=noninteractive
            export DEBIAN_PRIORITY=critical

            # Refresh package lists with retries
            apt-get update -y -o Acquire::Retries=3 || true

            # Upgrade only packages that can be upgraded without removing any
            apt-get upgrade -y -d -o Acquire::Retries=3 || true

            # Download any missing packages that failed in the previous step
            apt-get --fix-broken install -y -o Acquire::Retries=3 || true

            # Final update to ensure all package lists are current
            apt-get update -y -o Acquire::Retries=3 || true

            # Install essential packages with retry logic
            apt-get install -y -o Acquire::Retries=3 \
              debconf-utils \
              dialog \
              apt-utils \
              wget \
              curl \
              gcc \
              make \
              cmake \
              build-essential \
              r-base \
              r-base-dev \
              unzip \
              || true

            # Clean up apt cache to save disk space
            apt-get clean
            rm -rf /var/lib/apt/lists/*

      - run:
          name: Install Web drivers
          command: |
            export DEBIAN_FRONTEND=noninteractive
            export DEBIAN_PRIORITY=critical

            # Create temp directory for downloading packages
            mkdir -p /tmp/chromium-packages

            # Refresh package lists with retries
            apt-get update -y -o Acquire::Retries=3 || true

            # Download chromium and its dependencies (don't install yet)
            apt-get download chromium chromium-driver 2>/dev/null || true

            # Download any missing dependencies that failed
            for pkg in libsystemd0 libudev1 libcap2 libnss3 libglx-mesa0 libpam-systemd libnss-systemd samba-libs libpam-modules libperl5.32 python3-pkg-resources; do
              apt-get download $pkg 2>/dev/null || true
            done

            # Install downloaded packages with dpkg (ignore missing dependencies)
            dpkg -i /tmp/chromium-packages/*.deb 2>/dev/null || true

            # Fix broken dependencies and install remaining packages
            apt-get install -y -f --fix-missing -o Acquire::Retries=3 || true

            # Verify chromium installation
            if which chromium; then
              chromium --version
            else
              echo "WARNING: Chromium installation failed, skipping browser tests"
            fi

            # Verify chromedriver installation
            if which chromedriver; then
              chromedriver --version
            else
              echo "WARNING: Chromedriver installation failed"
            fi

            # Clean up temp directory
            rm -rf /tmp/chromium-packages

      - run:
          name: Install Node and NPM for Dash and General Python
          command: |
            # Configure Node.js 20 LTS repository (recommended LTS version)
            cd /tmp
            curl -fsSL https://deb.nodesource.com/setup_20.x -o nodesource_setup.sh || {
              echo "WARNING: NodeSource setup failed, using system Node.js"
              apt-get update -y -o Acquire::Retries=3 || true
              apt-get install -y -o Acquire::Retries=3 nodejs npm || true
              node --version || true
              npm --version || true
              exit 0
            }
            chmod +x ./nodesource_setup.sh
            ./nodesource_setup.sh || {
              echo "WARNING: NodeSource setup failed, using system Node.js"
              apt-get update -y -o Acquire::Retries=3 || true
              apt-get install -y -o Acquire::Retries=3 nodejs npm || true
              node --version || true
              npm --version || true
              exit 0
            }

            # Install Node and NPM with retry logic
            apt-get clean
            apt-get autoclean
            apt-get autoremove

            apt-get install -y -o Acquire::Retries=3 nodejs npm || true

            # Verify installations
            node --version
            npm --version

      - run:
          name: Install Python dependencies
          command: |
            pip install --no-cache-dir -U -r ./requirements-project.txt
            pip install --no-cache-dir -U -r ./requirements.txt
            pip install --no-cache-dir -U -r ./requirements-dev.txt
            invoke init --dev --list

      - run:
          name: Generate Dash Component
          command: |
            cd plotly/cxdash/

            #  Ensure the presence of a virtual environment
            if ! [[ -d ./venv ]] ; then
            python3 -m venv ./venv
            fi
            source ./venv/bin/activate

            # Ensure that essential project utilities are available
            echo "Install Python components"
            pip install -U pip setuptools wheel
            pip install -U -r requirements.txt

            echo "Install CanvasXpress NodeJS components"
            npm install canvasxpress
            npm install canvasxpress-react

            echo "Run build"
            npm run build
            cp -R ./cxdash ../../

      - run:
          name: Static analysis
          command: |
            prospector \
                --zero-exit \
                --show-profile \
                --no-autodetect \
                --strictness low \
                -o text \
                ./canvasxpress

      - run:
          name: Test
          command: invoke test

      - store_test_results:
          path: pytest_result.xml

      - run:
          name: Report
          command: invoke report

      - run:
          name: Deploy artifacts
          command: |
            echo "Repository is from $(git config --get remote.origin.url)"
            GIT_REPO_OWNER="$(git config --get remote.origin.url | cut -d: -f2 | cut -d/ -f1)"
            echo "Found repository owner ${GIT_REPO_OWNER}"

            # Only attempt the deployment for the project owner/committer
            if [ $GIT_REPO_OWNER == "docinfosci" ]
            then
              # Establish package components
              rm -rf ./dist
              python ./build_pkg_setup.py
              python setup.py sdist

              # Confirm the installation user account
              echo "Deploying via TWINE user ${TWINE_USERNAME}"

              # Only publish non-dev editions to PyPI
              GIT_WORKING_BRANCH="$(git branch | grep \* | cut -d ' ' -f2)"
              if [ $GIT_WORKING_BRANCH == "main" ]
              then
                  # Production deployment
                  twine upload --verbose -u $TWINE_USERNAME -p $PRD_TWINE_PASSWORD --repository pypi ./dist/*

              else
                  # Development deployment
                  twine upload --verbose -u $TWINE_USERNAME -p $TWINE_PASSWORD --repository testpypi ./dist/*

              fi

            else
              echo "Skipping deployment for repository owner ${GIT_REPO_OWNER}"

            fi

